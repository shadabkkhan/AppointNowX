[project]
name = "appointnowx"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pymysql>=1.2.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
